[package]
name = "filess"
version = "0.9.1"
edition = "2024"
description = "Simplified file management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zefirchiky/filess"
keywords = [
    "file",
    "util",
    "simple",
    "image",
    "serde",
]
categories = ["filesystem"]

[dependencies]
async-trait = "0.1.92"
dirs = { version = "6.0.0", optional = true }
glob = { version = "0.3.4", optional = true }
image = { version = "0.25.10", optional = true, default-features = false }
infer = { version = "0.19.0", optional = true }
open = { version = "5.4.1", optional = true }
rodio = { version = "0.22.2", default-features = false, optional = true }
ron = { version = "0.12.2", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
serde_toml = { package = "toml", version = "1.1.4", optional = true, features = ["fast_hash"] }
symphonia = { version = "0.5.5", optional = true, default-features = false }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "parking_lot", "rt"], optional = true }
trash = { version = "5.2.6", optional = true }
walkdir = { version = "2.5.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["all-files", "base"]
# default = ["txt", "md", "json", "all-images", "all-audio", "rayon"]
# default = ["txt", "md", "just_json", "all-images", "all-audio", "rayon"]
# default = ["all-files", "image", "async", "symphonia-simd", "rodio", "base"]
# default = ["serde", "image", "async", "rayon", "symphonia-simd", "rodio"]

base = ["rayon", "open", "walk", "infer", "trash", "glob", "dirs"]   # Small, mostly QOL crates

all-files = ["all-text", "all-images", "all-audio"]
all-text = ["all-models", "md", "txt"]
all-models = ["json", "toml", "ron"]
just-all-models = ["just_json", "just_toml", "just_ron"]    # Only files them-self, without integration
all-images = ["jpeg", "png", "webp", "avif", "tiff", "gif", "bmp", "exr", "ff", "hdr", "ico", "pnm", "qoi", "tga"]
all-audio = ["ogg", "mkv", "wav", "aiff", "flac", "mp4", "mp3", "mp2", "mp1", "mpa", "alac"]

just_json = ["_any_text", "_any_model"]
json =  ["_any_serde_model", "just_json", "dep:serde_json"]
just_toml = ["_any_text", "_any_model"]
toml =  ["_any_serde_model", "just_toml", "dep:serde_toml"]
just_ron = ["_any_text", "_any_model"]
ron =   ["_any_serde_model", "just_ron", "dep:ron"]
md =    ["_any_text"]
txt =   ["_any_text"]

jpeg =  ["_any_image", "image?/jpeg"]
png =   ["_any_image", "image?/png"]
webp =  ["_any_image", "image?/webp"]
avif =  ["_any_image", "image?/avif"]
tiff =  ["_any_image", "image?/tiff"]
gif =   ["_any_image", "image?/gif"]
bmp =   ["_any_image", "image?/bmp"]
exr =   ["_any_image", "image?/exr"]
ff =    ["_any_image", "image?/ff"]
hdr =   ["_any_image", "image?/hdr"]
ico =   ["_any_image", "image?/ico"]
pnm =   ["_any_image", "image?/pnm"]
qoi =   ["_any_image", "image?/qoi"]
tga =   ["_any_image", "image?/tga"]

# TODO: might need to refactor, change to specific symphonia flags
ogg =   ["_any_audio", "symphonia?/ogg", "symphonia?/vorbis", "symphonia?/flac", "symphonia?/pcm"]
mkv =   [
    "_any_audio",
    "symphonia?/mkv",
    "symphonia?/vorbis",
    "symphonia?/flac",
    "symphonia?/pcm",
    "symphonia?/mp3",
    "symphonia?/aac"
]
wav =   ["_any_audio", "symphonia?/wav", "symphonia?/pcm"]
aiff =  ["_any_audio", "symphonia?/aiff", "symphonia?/pcm"]
flac =  ["_any_audio", "symphonia?/flac"]
mp4 =   ["_any_audio", "symphonia?/isomp4", "symphonia?/aac", "symphonia?/alac", "symphonia?/mp3"]
mp3 =   ["_any_audio", "symphonia?/mp3"]
mp2 =   ["_any_audio", "symphonia?/mp2"]
mp1 =   ["_any_audio", "symphonia?/mp1"]
mpa =   ["_any_audio", "symphonia?/mpa", "symphonia?/mp3"]
alac =  ["_any_audio", "symphonia?/caf", "symphonia?/alac", "symphonia?/isomp4"]

_any_text = []
_any_model = []
_any_image = []
_any_audio = []
_any_serde_model = ["serde"]

serde = ["dep:serde", "image?/serde"]
image = ["dep:image"]
image-nasm = ["image", "image/nasm"]
rayon = ["image?/rayon"]
async = ["dep:tokio"]
audio = ["dep:symphonia"]
symphonia-simd = ["audio", "symphonia/opt-simd"]
rodio = ["audio", "dep:rodio"]
open = ["dep:open"]
infer = ["dep:infer"]
trash = ["dep:trash"]
walk = ["dep:walkdir"]
glob = ["dep:glob"]
dirs = ["dep:dirs"]

__full_test = []
